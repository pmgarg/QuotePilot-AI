[project]
name = "quotepilot-api"
version = "0.1.0"
description = "QuotePilot AI backend API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.18",
    "argon2-cffi>=23.1",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "rapidfuzz>=3.9",
    "reportlab>=4.2",
    "python-dateutil>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
ai = ["anthropic>=0.40"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-python-dateutil",
    "types-openpyxl",
    "types-reportlab",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "W"]
ignore = ["S101", "B008", "S104", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S108", "S603", "S607", "E501", "N817", "SLF001"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires PostgreSQL",
    "security: security-focused negative tests",
]
